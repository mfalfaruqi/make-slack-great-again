# A release from a version tag: pushing "v41" runs the whole of CI on that
# commit (ci.yml: the formatting check and the test suites of the three
# platforms), builds the release binaries once that has passed, and puts
# them on a draft GitHub Release for the tag, with notes generated from the
# pull requests merged since the last one. The draft is not public: look it
# over on the Releases page, then publish it there.
#
#   git tag v41 && git push origin v41
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # The release binaries, under the names the release carries.
  linux:
    name: Linux
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/configure-linux.sh
      # Linked against this runner's libraries (Ubuntu 24.04), so not the
      # static binary upstream ships. In a tarball: an artifact does not keep
      # the executable bit.
      - name: Build
        run: |
          scripts/release.sh
          tar -czf "msga-linux-$(uname -m).tar.gz" -C build-release msga
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: msga-linux-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS
    needs: ci
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/configure-mac.sh
      # Stripped and ad-hoc signed (not notarized: a downloaded copy has to be
      # let through Gatekeeper). Zipped without extended attributes: their
      # "._" side files would break the signature for anyone who unpacks with
      # unzip.
      - name: Build
        run: |
          scripts/release.sh
          ditto -c -k --norsrc --noextattr --keepParent build-release/msga.app "msga-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: msga-macos-*.zip
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      # The steps of scripts\release.ps1: MSGA_STATIC, one self-contained exe.
      - name: Build
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DMSGA_STATIC=ON -DMSGA_DEMO=OFF -DMSGA_BUILD_TESTS=OFF
          cmake --build build-release --target msga --parallel
          strip build-release/msga.exe
          cp build-release/msga.exe msga-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: msga-windows-x86_64.exe
          retention-days: 7
          if-no-files-found: error

  # All three or none: a release is made only when every binary was built.
  publish:
    name: Publish (draft)
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
