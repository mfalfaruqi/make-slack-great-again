# Pushing a version tag runs CI, builds the release binaries and attaches
# them to a draft GitHub Release (publish it from the Releases page):
#   git tag v41 && git push origin v41
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/configure-linux.sh
      # In a tarball: an artifact does not keep the executable bit.
      - name: Build
        run: |
          scripts/release.sh
          tar -czf "msga-linux-$(uname -m).tar.gz" -C build-release msga
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: msga-linux-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS
    needs: ci
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/configure-mac.sh
      # Without extended attributes: their "._" files break the signature
      # when the zip is unpacked with unzip.
      - name: Build
        run: |
          scripts/release.sh
          ditto -c -k --norsrc --noextattr --keepParent build-release/msga.app "msga-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: msga-macos-*.zip
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build
        shell: pwsh
        env:
          # The action installs MSYS2 outside C:\msys64.
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          scripts\release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-release\msga.exe msga-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: msga-windows-x86_64.exe
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish (draft)
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
