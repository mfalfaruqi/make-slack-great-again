# Build and test on Linux, macOS and Windows, and check the formatting.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned: other major versions format the same config differently.
      - name: Install clang-format 22
        run: pipx install 'clang-format==22.*'
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' \
            | xargs clang-format --dry-run --Werror

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/configure-linux.sh
      # Some tests depend on the UI font's shapes and widths; the runner
      # image only has DejaVu Sans, which they fail with.
      - name: Install the UI font
        run: sudo apt-get install -y fonts-noto-core
      - name: Build and test
        env:
          CTEST_ARGS: --timeout 300
        run: scripts/build.sh --test

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: scripts/configure-mac.sh
      # crash_tests hangs on macOS (not yet understood).
      - name: Build and test
        env:
          CTEST_ARGS: --timeout 300 -E ^crash_tests$
        run: scripts/build.sh --test

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Some tests compare files byte for byte: no CRLF conversion.
      - name: Keep line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Build and test
        shell: pwsh
        env:
          # The action installs MSYS2 outside C:\msys64.
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          CTEST_ARGS: --timeout 300
        run: scripts\build.ps1 --test
